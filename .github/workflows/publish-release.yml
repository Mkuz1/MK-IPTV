# One-click release: builds the signed APK + update feed (version.json) and publishes them as the
# latest release of this repo, which installed apps check for in-app updates.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of keystore/mk-iptv-release.jks   (base64 -w0 mk-iptv-release.jks)
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_PASSWORD       keyPassword from keystore.properties
#   KEY_ALIAS          key alias (the Play upload key: mkiptv-upload)
#   GOOGLE_SERVICES_JSON (optional) contents of app/google-services.json from Firebase (enables account sync)
name: Publish release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the in-app update dialog)"
        required: true
        default: "Bug fixes and improvements."

permissions:
  contents: write   # create the release in this repo

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches missing platforms.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mkiptv' }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/mk-iptv-release.jks
          {
            echo "storeFile=keystore/mk-iptv-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Firebase config (account sync)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::warning::GOOGLE_SERVICES_JSON not set - account sync is disabled in this build"; exit 0; fi
          case "$GSJ" in "{"*) printf '%s' "$GSJ" > app/google-services.json ;; *) echo "$GSJ" | base64 -d > app/google-services.json ;; esac
          python3 -c "import json;d=json.load(open('app/google-services.json'));print('Firebase project', d['project_info']['project_id'])"

      - name: Test
        run: ./gradlew -q :app:testDirectDebugUnitTest --tests '*XtreamApiTest*' --tests '*ProgressTest*' --tests '*UpdateAndCacheTest*'

      - name: Build APK + update feed
        env:
          NOTES: ${{ inputs.notes }}
        run: tools/make-release.sh "$NOTES"

      - name: Publish release in this repo
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('dist/version.json'))['versionName'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          keytool -printcert -jarfile "dist/MK-IPTV-$VERSION-android.apk" | grep -E "Owner|SHA256" | head -2
          gh release create "android-v$VERSION" "dist/MK-IPTV-$VERSION-android.apk" "dist/MK-IPTV-$VERSION-android.aab" dist/version.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MK IPTV for Android $VERSION" \
            --notes "$NOTES (Phone, tablet, Google TV. Signed with the Play upload key; installed copies update in-app.)" --latest
          curl -sSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version.json"

      - name: Remove signing material
        if: always()
        run: rm -f keystore/mk-iptv-release.jks keystore.properties app/google-services.json
