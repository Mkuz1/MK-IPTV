# Deploys the landing page (site/) to Cloudflare Pages: https://mkiptv.pages.dev
# Repository secrets: CLOUDFLARE_API_TOKEN (API Token with "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID.
name: Website deploy

on:
  workflow_dispatch:
  push:
    branches: [claude/upbeat-allen-sin4my]
    paths: ["site/src/**", "site/assets/**", "site/build.py", ".github/workflows/site-deploy.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: mkiptv
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the website."; exit 0
          fi
          echo "READY=1" >> "$GITHUB_ENV"
      - name: Build
        if: env.READY == '1'
        run: python3 site/build.py
      - name: Create the Pages project (first run only)
        if: env.READY == '1'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || echo "Project exists"
      - name: Deploy
        if: env.READY == '1'
        run: npx --yes wrangler@3 pages deploy site/dist --project-name "$PROJECT" --branch main --commit-dirty=true
