# Takes App Store screenshots of the Apple TV app (tvOS simulator) and the Mac app (Mac Catalyst window)
# with the public demo playlist, and commits them to store-assets/apple/.
name: Apple screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: Apple TV screenshots (simulator)
        working-directory: ios
        run: |
          set -x
          xcodebuild -project MKIPTV.xcodeproj -scheme MKIPTVTV -configuration Debug -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > tv.log 2>&1 || { grep error: tv.log | head -40; exit 1; }
          APP=$(ls -d build/Build/Products/Debug-appletvsimulator/*.app | head -1)
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='tvOS' and x['isAvailable']];print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin)['devicetypes'] if 'Apple TV 4K' in x['name']];print(d[-1]['identifier'])")
          UDID=$(xcrun simctl create shots "$DT" "$RT")
          xcrun simctl boot "$UDID"; sleep 20
          xcrun simctl install "$UDID" "$APP"
          mkdir -p ../store-assets/apple/tv
          n=1
          for tab in movies series live favorites; do
            xcrun simctl terminate "$UDID" com.mkuz.mkiptv || true
            SIMCTL_CHILD_MK_TAB=$tab xcrun simctl launch "$UDID" com.mkuz.mkiptv
            sleep 35
            xcrun simctl io "$UDID" screenshot "../store-assets/apple/tv/0$n-$tab.png"; n=$((n+1))
          done
          sips -g pixelWidth -g pixelHeight ../store-assets/apple/tv/*.png

      - name: Mac screenshots (Mac Catalyst window)
        working-directory: ios
        run: |
          set -x
          xcodebuild -project MKIPTV.xcodeproj -scheme MKIPTV -configuration Debug -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= CODE_SIGNING_REQUIRED=NO build > mac.log 2>&1 || { grep error: mac.log | head -40; exit 1; }
          APP=$(ls -d build/Build/Products/Debug-maccatalyst/*.app | head -1)
          pip3 install -q --break-system-packages pyobjc-framework-Quartz || pip3 install -q pyobjc-framework-Quartz
          mkdir -p ../store-assets/apple/mac raw
          system_profiler SPDisplaysDataType | grep -i resolution || true
          n=1
          for tab in movies series live favorites; do
            pkill -x MKIPTV || true; sleep 2
            open --env MK_TAB=$tab "$APP"
            sleep 35
            WID=$(python3 -c "
          import Quartz
          ws = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID)
          w = [x for x in ws if x.get('kCGWindowOwnerName') == 'MKIPTV' and x.get('kCGWindowLayer') == 0]
          w.sort(key=lambda x: -x['kCGWindowBounds']['Width'] * x['kCGWindowBounds']['Height'])
          print(w[0]['kCGWindowNumber'] if w else '')")
            if [ -n "$WID" ]; then screencapture -x -o -l "$WID" "raw/$tab.png"; else screencapture -x "raw/$tab.png"; fi
            python3 ../tools/apple-assets/mac_shot.py "raw/$tab.png" "../store-assets/apple/mac/0$n-$tab.png"; n=$((n+1))
          done
          pkill -x MKIPTV || true
          sips -g pixelWidth -g pixelHeight raw/*.png ../store-assets/apple/mac/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: apple-screenshots
          path: store-assets/apple

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-assets/apple
          git commit -m "Apple TV and Mac App Store screenshots" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
