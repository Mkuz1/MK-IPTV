# Compiles the Apple apps for every platform (unsigned): iPhone/iPad, Mac (Mac Catalyst) and Apple TV.
name: Apple platforms build check

on:
  workflow_dispatch:
  push:
    branches: [claude/upbeat-allen-sin4my]
    paths: ["ios/**", ".github/workflows/apple-platforms.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            scheme: MKIPTV
            destination: generic/platform=iOS
          - platform: macos
            scheme: MKIPTV
            destination: generic/platform=macOS,variant=Mac Catalyst
          - platform: tvos
            scheme: MKIPTVTV
            destination: generic/platform=tvOS
    name: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -iE "tvos|macos|ios" || true

      - name: Firebase config
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GSI" ]; then exit 0; fi
          case "$GSI" in "<"*) printf '%s' "$GSI" > ios/MKIPTV/GoogleService-Info.plist ;; *) echo "$GSI" | base64 -d > ios/MKIPTV/GoogleService-Info.plist ;; esac

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild -project MKIPTV.xcodeproj -scheme ${{ matrix.scheme }} -configuration Release \
            -destination '${{ matrix.destination }}' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          echo "=== ERRORS"
          grep -E "error:" build.log | sed 's|.*/ios/|ios/|' | sort -u | head -80
          tail -5 build.log
          exit $status
